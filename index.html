<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>بوصلة تربية الأطفال</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=Reem+Kufi:wght@500;700&display=swap" rel="stylesheet">
<style>
/* Layout idea: a deep colored band holds the title and the searchable picker;
   one white card overlaps it and lists the five sub-topics. The hue (--h) follows the chosen topic. */
:root{
  --h:28;
  --bg:#f1f4f0;
  --surface:#ffffff;
  --ink:#15221c;
  --muted:#58685f;
  --line:#dce3dc;
  --accent:hsl(var(--h) 64% 34%);
  --accent-soft:hsl(var(--h) 62% 93%);
  --band:hsl(var(--h) 46% 18%);
  --band-glow:hsl(var(--h) 60% 32%);
  --on-band:#f8f6ef;
  --on-band-muted:hsl(var(--h) 32% 82%);
  --on-accent:#ffffff;
  --shadow:0 1px 2px rgb(20 35 28 / .06), 0 18px 40px -18px rgb(20 35 28 / .28);
  --font-display:'Reem Kufi','IBM Plex Sans Arabic',Tahoma,sans-serif;
  --font-body:'IBM Plex Sans Arabic','Segoe UI',Tahoma,Arial,sans-serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0e1513;
    --surface:#161f1c;
    --ink:#e9efea;
    --muted:#9babA3;
    --line:#27332e;
    --accent:hsl(var(--h) 70% 70%);
    --accent-soft:hsl(var(--h) 38% 17%);
    --band:hsl(var(--h) 40% 12%);
    --band-glow:hsl(var(--h) 52% 22%);
    --on-accent:#10160f;
    --shadow:0 1px 2px rgb(0 0 0 / .4), 0 18px 40px -18px rgb(0 0 0 / .7);
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0e1513;
  --surface:#161f1c;
  --ink:#e9efea;
  --muted:#9baba3;
  --line:#27332e;
  --accent:hsl(var(--h) 70% 70%);
  --accent-soft:hsl(var(--h) 38% 17%);
  --band:hsl(var(--h) 40% 12%);
  --band-glow:hsl(var(--h) 52% 22%);
  --on-accent:#10160f;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 18px 40px -18px rgb(0 0 0 / .7);
  color-scheme:dark;
}

*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--font-body);
  font-size:17px;
  line-height:1.7;
}
.wrap{width:min(100% - 32px, 760px);margin-inline:auto}
svg.ic{width:1em;height:1em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* ---------- band ---------- */
.band{
  position:relative;
  background:
    radial-gradient(60% 90% at 12% 0%, var(--band-glow) 0%, transparent 70%),
    var(--band);
  color:var(--on-band);
  padding:44px 0 120px;
  transition:background-color .5s ease;
}
.band-art{
  position:absolute;inset:0;overflow:hidden;pointer-events:none;
}
.band-art svg{
  position:absolute;inset-inline-end:-70px;top:-60px;
  width:380px;height:380px;
  stroke:var(--on-band);opacity:.13;fill:none;stroke-width:1;
}
.band .wrap{position:relative}
.brand{
  display:inline-flex;align-items:center;gap:8px;
  font-size:14px;font-weight:500;color:var(--on-band-muted);
  margin:0 0 14px;
}
.brand svg{font-size:18px}
h1{
  font-family:var(--font-display);
  font-weight:700;
  font-size:clamp(34px, 7.4vw, 56px);
  line-height:1.25;
  margin:0 0 10px;
  text-wrap:balance;
}
.lede{
  margin:0 0 28px;
  max-width:34em;
  color:var(--on-band-muted);
  font-size:18px;
}

/* ---------- combobox ---------- */
.combo{position:relative;z-index:20}
.combo label{
  display:block;font-weight:600;font-size:15px;margin-bottom:8px;color:var(--on-band);
}
.combo-box{
  display:flex;align-items:center;gap:10px;
  background:var(--surface);color:var(--ink);
  border-radius:16px;
  padding:6px 8px 6px 6px;
  padding-inline-start:16px;
  box-shadow:var(--shadow);
  border:2px solid transparent;
  transition:border-color .2s;
}
.combo-box:focus-within{border-color:var(--accent)}
.combo-box > svg{font-size:20px;color:var(--muted)}
.combo input{
  flex:1;min-width:0;
  border:0;outline:0;background:transparent;color:inherit;
  font:inherit;font-size:18px;font-weight:500;
  padding:12px 0;
}
.combo input::placeholder{color:var(--muted);font-weight:400}
.combo-toggle{
  flex:none;width:44px;height:44px;border-radius:12px;border:0;cursor:pointer;
  display:grid;place-items:center;
  background:var(--accent-soft);color:var(--accent);
  font-size:20px;
  transition:background-color .3s, color .3s, transform .2s;
}
.combo-toggle:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.combo[data-open="true"] .combo-toggle svg{transform:rotate(180deg)}
.combo-toggle svg{transition:transform .2s}
.combo-meta{margin:8px 4px 0;font-size:14px;color:var(--on-band-muted);font-variant-numeric:tabular-nums}

.combo-list{
  position:absolute;inset-inline:0;top:calc(100% - 22px);
  margin:0;padding:6px;list-style:none;
  background:var(--surface);color:var(--ink);
  border:1px solid var(--line);
  border-radius:16px;
  box-shadow:var(--shadow);
  max-height:336px;overflow-y:auto;overscroll-behavior:contain;
}
.combo-list[hidden]{display:none}
.opt{
  display:flex;align-items:center;gap:12px;
  padding:10px 12px;border-radius:11px;cursor:pointer;
  --oh:28;
}
.opt-ic{
  flex:none;width:38px;height:38px;border-radius:11px;display:grid;place-items:center;font-size:19px;
  background:hsl(var(--oh) 62% 93%);color:hsl(var(--oh) 64% 34%);
}
.opt-text{flex:1;min-width:0}
.opt-title{display:block;font-weight:600;line-height:1.4}
.opt-sub{display:block;font-size:13.5px;color:var(--muted);line-height:1.5}
.opt-check{font-size:18px;color:var(--accent);visibility:hidden}
.opt[aria-selected="true"] .opt-check{visibility:visible}
.opt.is-active{background:var(--accent-soft)}
.opt-empty{padding:18px 14px;color:var(--muted);text-align:center}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]) .opt-ic{background:hsl(var(--oh) 38% 20%);color:hsl(var(--oh) 70% 72%)}
}
:root[data-theme="dark"] .opt-ic{background:hsl(var(--oh) 38% 20%);color:hsl(var(--oh) 70% 72%)}

/* ---------- result card ---------- */
main{margin-top:-84px;position:relative;z-index:10;padding-bottom:40px}
.card{
  background:var(--surface);
  border-radius:22px;
  box-shadow:var(--shadow);
  overflow:hidden;
}
.card-head{
  display:flex;gap:16px;align-items:center;
  padding:24px 24px 20px;
  border-bottom:1px solid var(--line);
}
.topic-ic{
  flex:none;width:60px;height:60px;border-radius:18px;
  display:grid;place-items:center;font-size:30px;
  background:var(--accent);color:var(--on-accent);
  transition:background-color .4s;
}
.card-head h2{
  font-family:var(--font-display);font-weight:700;
  font-size:clamp(22px, 4.6vw, 28px);line-height:1.35;margin:0;
  text-wrap:balance;
}
.card-head p{margin:2px 0 0;color:var(--muted);font-size:15.5px}

.subs{list-style:none;margin:0;padding:8px}
.subs li{display:flex;align-items:center;gap:4px}
.subs li + li{border-top:1px solid var(--line)}
.sub{flex:1;min-width:0}
.sub-copy{
  flex:none;width:40px;height:40px;margin-inline-end:8px;border-radius:12px;cursor:pointer;
  display:grid;place-items:center;font-size:18px;
  background:transparent;color:var(--muted);border:1px solid var(--line);
  transition:color .2s, border-color .2s, background-color .2s;
}
.sub-copy:hover{color:var(--accent);border-color:var(--accent)}
.sub-copy:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
.sub-copy.done{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}
.toast{
  position:fixed;inset-inline:16px;bottom:18px;margin-inline:auto;width:fit-content;max-width:calc(100% - 32px);
  background:var(--ink);color:var(--bg);padding:10px 16px;border-radius:12px;font-size:14.5px;
  box-shadow:var(--shadow);z-index:50;overflow-wrap:anywhere;user-select:all;
}
.toast[hidden]{display:none}
.sub{
  display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;
  padding:16px;border-radius:14px;
  color:inherit;text-decoration:none;
  transition:background-color .2s;
}
.sub:hover{background:var(--accent-soft)}
.sub:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
.sub-ic{
  width:50px;height:50px;border-radius:15px;display:grid;place-items:center;font-size:24px;
  background:var(--accent-soft);color:var(--accent);
  transition:background-color .2s, color .2s, transform .2s;
}
.sub:hover .sub-ic,.sub:focus-visible .sub-ic{background:var(--accent);color:var(--on-accent);transform:scale(1.06)}
.sub-title{display:block;font-weight:600;font-size:17.5px;line-height:1.5}
.sub-desc{display:block;color:var(--muted);font-size:15px;line-height:1.65}
.sub-src{
  display:inline-flex;flex-wrap:wrap;align-items:center;gap:6px;
  margin-top:6px;font-size:13px;font-weight:500;color:var(--accent);
}
.sub-src .lang{
  color:var(--muted);border:1px solid var(--line);border-radius:999px;padding:0 8px;font-weight:400;line-height:1.7;
}
.sub-go{
  width:34px;height:34px;border-radius:50%;display:grid;place-items:center;font-size:16px;
  color:var(--muted);border:1px solid var(--line);
  transition:color .2s, border-color .2s, transform .2s;
}
.sub:hover .sub-go{color:var(--accent);border-color:var(--accent);transform:translate(-2px,-2px)}

@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.subs li{animation:rise .45s both;animation-delay:calc(var(--i) * 55ms)}

.note{
  margin:18px 4px 0;font-size:14px;color:var(--muted);
}

@media (max-width:480px){
  body{font-size:16px}
  .band{padding-top:30px}
  .card-head{padding:18px 16px 16px;gap:12px}
  .topic-ic{width:50px;height:50px;border-radius:15px;font-size:25px}
  .sub{padding:14px 8px;gap:12px}
  .sub-ic{width:44px;height:44px;border-radius:13px;font-size:21px}
  .sub-go{display:none}
  .sub{grid-template-columns:auto 1fr}
  .sub-copy{margin-inline-end:2px;width:36px;height:36px}
}
@media (prefers-reduced-motion: reduce){
  *{animation:none !important;transition:none !important}
}
</style>
</head>

const ICONS = {

  apple:'<path d="M12 20.94c1.5 0 2.75 1.06 4 1.06 3 0 6-8 6-12.22A4.91 4.91 0 0 0 17 5c-2.22 0-4 1.44-5 2-1-.56-2.78-2-5-2a4.9 4.9 0 0 0-5 4.78C2 14 5 22 8 22c1.25 0 2.5-1.06 4-1.06Z"/><path d="M10 2c1 .5 2 2 2 5"/>',

};
const icon = name => '<svg class="ic" viewBox="0 0 24 24" aria-hidden="true">' + (ICONS[name] || ICONS.star) + '</svg>';
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));

/* توحيد الحروف العربية المتشابهة في البحث: أ/إ/آ = ا ، ى/ئ = ي ، ة = ه ، بلا تشكيل */
const norm = s => String(s)
  .normalize('NFKD')
  .replace(/[ً-ٰٟـ]/g, '')
  .replace(/[أإآٱ]/g, 'ا')
  .replace(/[ئى]/g, 'ي')
  .replace(/ؤ/g, 'و')
  .replace(/ة/g, 'ه')
  .replace(/ء/g, '')
  .toLowerCase()
  .replace(/\s+/g, ' ')
  .trim();

TOPICS.forEach(t => {
  t._hay = norm([t.title, t.blurb, t.keys || '', ...t.subs.map(s => s.title)].join(' '));
});

const $ = id => document.getElementById(id);
const combo = $('combo'), input = $('topic-search'), list = $('topic-list'),
      meta = $('topic-meta'), toggle = $('topic-toggle');

/* ملف مستقل (مُصدَّر): افتح الرابط في نفس الصفحة. داخل إطار العرض: افتحه في نافذة جديدة. */
const STANDALONE = (() => { try { return window.top === window.self; } catch (e) { return false; } })();
const LINK_ATTRS = STANDALONE ? '' : ' target="_blank" rel="noopener noreferrer"';

let current = TOPICS[0];
let shown = TOPICS.slice();
let active = 0;
let open = false;

try {
  const saved = localStorage.getItem('parenting-topic');
  const found = TOPICS.find(t => t.id === saved);
  if (found) current = found;
} catch (e) {}

function renderTopic(t) {
  current = t;
  document.documentElement.style.setProperty('--h', t.h);
  $('topic-ic').innerHTML = icon(t.icon);
  $('topic-title').textContent = t.title;
  $('topic-blurb').textContent = t.blurb;
  $('subs').innerHTML = t.subs.map((s, i) =>
    '<li style="--i:' + i + '">' +
      '<a class="sub" href="' + esc(s.url) + '"' + LINK_ATTRS + ' ' +
         'title="افتح المصدر: ' + esc(s.org) + '">' +
        '<span class="sub-ic">' + icon(s.icon) + '</span>' +
        '<span>' +
          '<span class="sub-title">' + esc(s.title) + '</span>' +
          '<span class="sub-desc">' + esc(s.desc) + '</span>' +
          '<span class="sub-src">' + esc(s.org) + '<span class="lang">' + esc(s.lang) + '</span></span>' +
        '</span>' +
        '<span class="sub-go">' + icon('out') + '</span>' +
      '</a>' +
      '<button class="sub-copy" type="button" data-url="' + esc(s.url) + '" ' +
        'aria-label="انسخ رابط المصدر: ' + esc(s.title) + '" title="انسخ الرابط">' + icon('copy') + '</button>' +
    '</li>').join('');
  input.value = t.title;
  try { localStorage.setItem('parenting-topic', t.id); } catch (e) {}
}

function renderList() {
  if (!shown.length) {
    list.innerHTML = '<li class="opt-empty" role="presentation">لا يوجد موضوع بهذه الكلمة. جرّب كلمة أخرى.</li>';
    input.removeAttribute('aria-activedescendant');
    return;
  }
  list.innerHTML = shown.map((t, i) =>
    '<li class="opt' + (i === active ? ' is-active' : '') + '" role="option" id="opt-' + t.id + '" ' +
        'data-id="' + t.id + '" aria-selected="' + (t === current) + '" style="--oh:' + t.h + '">' +
      '<span class="opt-ic">' + icon(t.icon) + '</span>' +
      '<span class="opt-text"><span class="opt-title">' + esc(t.title) + '</span>' +
        '<span class="opt-sub">' + esc(t.blurb) + '</span></span>' +
      '<span class="opt-check">' + icon('tick') + '</span>' +
    '</li>').join('');
  const el = list.children[active];
  if (el) {
    input.setAttribute('aria-activedescendant', el.id);
    el.scrollIntoView({ block: 'nearest' });
  }
}

function setMeta(filtering) {
  meta.textContent = filtering
    ? 'النتائج: ' + shown.length + ' من ' + TOPICS.length
    : 'عدد المواضيع: ' + TOPICS.length + '. اكتب أي كلمة للبحث.';
}

function filter(q) {
  const n = norm(q);
  shown = n ? TOPICS.filter(t => n.split(' ').every(w => t._hay.includes(w))) : TOPICS.slice();
  active = 0;
  setMeta(!!n);
  renderList();
}

function openList(showAll) {
  if (showAll) {
    shown = TOPICS.slice();
    active = Math.max(0, shown.indexOf(current));
    setMeta(false);
  }
  open = true;
  list.hidden = false;
  combo.dataset.open = 'true';
  input.setAttribute('aria-expanded', 'true');
  renderList();
}

function closeList() {
  open = false;
  list.hidden = true;
  combo.dataset.open = 'false';
  input.setAttribute('aria-expanded', 'false');
  input.removeAttribute('aria-activedescendant');
  input.value = current.title;
  shown = TOPICS.slice();
  setMeta(false);
}

function pick(t) {
  renderTopic(t);
  closeList();
}

input.addEventListener('focus', () => { openList(true); input.select(); });
input.addEventListener('click', () => { if (!open) { openList(true); input.select(); } });
input.addEventListener('input', () => { if (!open) openList(false); filter(input.value); });
input.addEventListener('keydown', e => {
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!open) { openList(true); return; }
    if (!shown.length) return;
    active = (active + (e.key === 'ArrowDown' ? 1 : -1) + shown.length) % shown.length;
    renderList();
  } else if (e.key === 'Enter') {
    e.preventDefault();
    if (open && shown[active]) { pick(shown[active]); input.blur(); }
  } else if (e.key === 'Escape') {
    if (open) { e.preventDefault(); closeList(); input.blur(); }
  } else if (e.key === 'Tab') {
    if (open) closeList();
  }
});
toggle.addEventListener('mousedown', e => e.preventDefault());
toggle.addEventListener('click', () => {
  if (open) { closeList(); input.blur(); }
  else { input.focus(); }
});
list.addEventListener('mousedown', e => e.preventDefault());
list.addEventListener('click', e => {
  const li = e.target.closest('.opt');
  if (!li) return;
  const t = TOPICS.find(x => x.id === li.dataset.id);
  if (t) { pick(t); input.blur(); }
});
list.addEventListener('mousemove', e => {
  const li = e.target.closest('.opt');
  if (!li) return;
  const i = Array.prototype.indexOf.call(list.children, li);
  if (i !== active && i > -1) {
    active = i;
    Array.prototype.forEach.call(list.children, (c, k) => c.classList.toggle('is-active', k === i));
    input.setAttribute('aria-activedescendant', li.id);
  }
});
document.addEventListener('pointerdown', e => {
  if (open && !combo.contains(e.target)) closeList();
});

const toast = $('toast');
let toastTimer;
function showToast(text, ms) {
  toast.textContent = text;
  toast.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { toast.hidden = true; }, ms);
}
function legacyCopy(text) {
  try {
    const ta = document.createElement('textarea');
    ta.value = text; ta.setAttribute('readonly', '');
    ta.style.cssText = 'position:fixed;top:0;opacity:0';
    document.body.appendChild(ta); ta.select();
    const ok = document.execCommand('copy');
    ta.remove();
    return ok;
  } catch (e) { return false; }
}
$('subs').addEventListener('click', e => {
  const btn = e.target.closest('.sub-copy');
  if (!btn) return;
  const url = btn.dataset.url;
  const done = () => {
    btn.classList.add('done'); btn.innerHTML = icon('tick');
    showToast('تم نسخ الرابط. الصقه في المتصفح.', 2600);
    setTimeout(() => { btn.classList.remove('done'); btn.innerHTML = icon('copy'); }, 1800);
  };
  const fail = () => { if (legacyCopy(url)) done(); else showToast(url, 12000); };
  try {
    if (navigator.clipboard && navigator.clipboard.writeText) navigator.clipboard.writeText(url).then(done, fail);
    else fail();
  } catch (err) { fail(); }
});

/* داخل إطار معاينة: إن لم يُفتح الرابط خلال لحظة، جرّب طرقاً أخرى لفتحه. */
let leftPage = false;
window.addEventListener('blur', () => { leftPage = true; });
document.addEventListener('visibilitychange', () => { if (document.hidden) leftPage = true; });
$('subs').addEventListener('click', e => {
  const a = e.target.closest('a.sub');
  if (!a || STANDALONE) return;
  const url = a.href;
  leftPage = false;
  setTimeout(() => {
    if (leftPage) return;
    let w = null;
    try { w = window.open(url, '_blank'); } catch (err) {}
    if (w) { try { w.opener = null; } catch (err) {} return; }
    try { window.top.location.href = url; return; } catch (err) {}
    legacyCopy(url);
    showToast('هذه المعاينة تمنع فتح الروابط. افتح الملف في متصفح مثل Chrome وستفتح مباشرة.', 9000);
  }, 800);
});

renderTopic(current);
setMeta(false);
</script>
